<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .wrapper {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .counter {
      font-family: monospace;
      font-size: 24px;
      font-weight: 800;
      color: #ef4444;
      background: #050811;
      padding: 4px 10px;
      border-radius: 4px;
      min-width: 65px;
      text-align: center;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 10px;
    }
    .face-btn:hover { background: #475569; }
    #grid {
      display: grid;
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #475569;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s;
    }
    .cell:hover { background: #334155; }
    .cell.revealed {
      background: #0f172a;
      cursor: default;
    }
    .cell.mine {
      background: #ef4444 !important;
      color: white;
    }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #fb923c; }
    .c-6 { color: #2dd4bf; }
    .c-7 { color: #f472b6; }
    .c-8 { color: #cbd5e1; }
    .footer {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="counter" id="mine-count">010</div>
      <button class="face-btn" id="face-btn">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>

    <div id="grid"></div>

    <div class="footer">Left-click to reveal · Right-click or long-press to flag</div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face-btn');

    gridEl.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;

    let board = [];
    let gameOver = false;
    let timer = 0;
    let timerInterval = null;
    let firstClick = true;
    let flagsPlaced = 0;

    function initGame() {
      gameOver = false;
      firstClick = true;
      flagsPlaced = 0;
      clearInterval(timerInterval);
      timer = 0;
      timerEl.textContent = '000';
      mineCountEl.textContent = String(MINES).padStart(3, '0');
      faceBtn.textContent = '🙂';

      board = [];
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0
          };
        }
      }
      render();
    }

    function placeMines(excludeR, excludeC) {
      let placed = 0;
      while (placed < MINES) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if ((r === excludeR && c === excludeC) || board[r][c].isMine) continue;
        board[r][c].isMine = true;
        placed++;
      }

      // Compute counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) continue;
          let cnt = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                cnt++;
              }
            }
          }
          board[r][c].count = cnt;
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer = Math.min(999, timer + 1);
        timerEl.textContent = String(timer).padStart(3, '0');
      }, 1000);
    }

    function reveal(r, c) {
      if (gameOver || board[r][c].flagged || board[r][c].revealed) return;

      if (firstClick) {
        firstClick = false;
        placeMines(r, c);
        startTimer();
      }

      const cell = board[r][c];
      cell.revealed = true;

      if (cell.isMine) {
        // Boom!
        endGame(false);
        return;
      }

      if (cell.count === 0) {
        // Flood fill reveal
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !board[nr][nc].revealed) {
              reveal(nr, nc);
            }
          }
        }
      }

      render();
      checkWin();
    }

    function toggleFlag(r, c) {
      if (gameOver || board[r][c].revealed) return;
      const cell = board[r][c];
      cell.flagged = !cell.flagged;
      flagsPlaced += cell.flagged ? 1 : -1;
      mineCountEl.textContent = String(Math.max(0, MINES - flagsPlaced)).padStart(3, '0');
      render();
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine && !board[r][c].revealed) unrevealedSafe++;
        }
      }
      if (unrevealedSafe === 0) {
        endGame(true);
      }
    }

    function endGame(won) {
      gameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = won ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) {
            board[r][c].revealed = true;
          }
        }
      }
      render();
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const data = board[r][c];
          const div = document.createElement('div');
          div.className = 'cell';

          if (data.revealed) {
            div.classList.add('revealed');
            if (data.isMine) {
              div.classList.add('mine');
              div.textContent = '💣';
            } else if (data.count > 0) {
              div.textContent = data.count;
              div.classList.add('c-' + data.count);
            }
          } else if (data.flagged) {
            div.textContent = '🚩';
          }

          div.addEventListener('click', () => reveal(r, c));
          div.addEventListener('contextmenu', e => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          gridEl.appendChild(div);
        }
      }
    }

    faceBtn.addEventListener('click', initGame);
    initGame();
  </script>
</body>
</html>
