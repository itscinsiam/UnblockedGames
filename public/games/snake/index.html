<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .stat { display: flex; flex-direction: column; }
    .label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
    .val { font-size: 20px; font-weight: 700; color: #10b981; }
    #board {
      position: relative;
      width: 400px;
      height: 400px;
      max-width: 90vw;
      max-height: 90vw;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #0f172a;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .btn {
      background: #10b981;
      color: #0f172a;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #34d399; transform: scale(1.05); }
    .mobile-pad {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
      margin-top: 16px;
    }
    .pad-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .pad-btn:active { background: #334155; }
    .pad-up { grid-column: 2; grid-row: 1; }
    .pad-left { grid-column: 1; grid-row: 2; }
    .pad-down { grid-column: 2; grid-row: 2; }
    .pad-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <span class="val" id="score">0</span>
      </div>
      <div class="stat" style="align-items: flex-end;">
        <span class="label">Best</span>
        <span class="val" id="best" style="color: #38bdf8;">0</span>
      </div>
    </div>

    <div id="board">
      <canvas id="canvas" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title" style="font-size: 28px; color: #10b981;">Snake Retro</h2>
        <p id="overlay-sub" style="color: #94a3b8; font-size: 14px;">Use Arrow keys or WASD</p>
        <button class="btn" id="start-btn">Play Now</button>
      </div>
    </div>

    <div class="mobile-pad">
      <button class="pad-btn pad-up" onclick="changeDir(0, -1)">▲</button>
      <button class="pad-btn pad-left" onclick="changeDir(-1, 0)">◀</button>
      <button class="pad-btn pad-down" onclick="changeDir(0, 1)">▼</button>
      <button class="pad-btn pad-right" onclick="changeDir(1, 0)">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    const GRID_SIZE = 20;
    const TILE_COUNT = 20; // 400 / 20

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = best;
    let gameInterval = null;
    let isRunning = false;

    function spawnFood() {
      while (true) {
        let fx = Math.floor(Math.random() * TILE_COUNT);
        let fy = Math.floor(Math.random() * TILE_COUNT);
        if (!snake.some(segment => segment.x === fx && segment.y === fy)) {
          food = {x: fx, y: fy};
          break;
        }
      }
    }

    function startGame() {
      snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreEl.textContent = '0';
      spawnFood();
      overlay.style.display = 'none';
      isRunning = true;
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameStep, 95);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);
      if (score > best) {
        best = score;
        localStorage.setItem('snake_best', best);
        bestEl.textContent = best;
      }
      overlayTitle.textContent = 'Game Over';
      overlayTitle.style.color = '#ef4444';
      overlaySub.textContent = 'Final Score: ' + score;
      startBtn.textContent = 'Try Again';
      overlay.style.display = 'flex';
    }

    function gameStep() {
      dx = nextDx;
      dy = nextDy;
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }

      render();
    }

    function render() {
      // Clear
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i < TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10b981'; // Head
        } else {
          ctx.fillStyle = '#34d399';
        }
        ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });
    }

    function changeDir(newDx, newDy) {
      if (!isRunning) return;
      if (newDx !== 0 && dx === -newDx) return;
      if (newDy !== 0 && dy === -newDy) return;
      nextDx = newDx;
      nextDy = newDy;
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); changeDir(0, -1); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); changeDir(0, 1); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); changeDir(-1, 0); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); changeDir(1, 0); }
      if (e.code === 'Space' && !isRunning) { e.preventDefault(); startGame(); }
    });

    startBtn.addEventListener('click', startGame);
    render();
  </script>
</body>
</html>
