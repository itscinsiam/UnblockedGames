<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #game-container {
      position: relative;
      width: 240px;
      height: 480px;
      background: #050811;
      border: 2px solid #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 120px;
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
    }
    .panel-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .panel-val {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      font-family: monospace;
    }
    .btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #4f46e5; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 17, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="game-container">
      <canvas id="canvas" width="240" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title" style="font-size: 24px; color: #a855f7;">TETRIS</h2>
        <p style="font-size: 12px; color: #94a3b8; text-align: center;">[Arrows / WASD]<br>Space to Hard Drop</p>
        <button class="btn" id="start-btn">Start Game</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="panel-label">Score</div>
        <div class="panel-val" id="score">0</div>
      </div>
      <div class="panel">
        <div class="panel-label">Lines</div>
        <div class="panel-val" id="lines">0</div>
      </div>
      <div class="panel">
        <div class="panel-label">Level</div>
        <div class="panel-val" id="level">1</div>
      </div>
      <div class="panel">
        <div class="panel-label">Next</div>
        <canvas id="next-canvas" width="80" height="80" style="display: block; margin: 0 auto;"></canvas>
      </div>
      <button class="btn" id="pause-btn">Pause</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 24;

    const PIECES = [
      { shape: [[1,1,1,1]], color: '#06b6d4' }, // I
      { shape: [[1,1],[1,1]], color: '#eab308' }, // O
      { shape: [[0,1,0],[1,1,1]], color: '#a855f7' }, // T
      { shape: [[1,0,0],[1,1,1]], color: '#3b82f6' }, // J
      { shape: [[0,0,1],[1,1,1]], color: '#f97316' }, // L
      { shape: [[0,1,1],[1,1,0]], color: '#22c55e' }, // S
      { shape: [[1,1,0],[0,1,1]], color: '#ef4444' }  // Z
    ];

    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let currentPiece = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let level = 1;
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let isRunning = false;
    let isPaused = false;

    function randomPiece() {
      const p = PIECES[Math.floor(Math.random() * PIECES.length)];
      return {
        shape: p.shape,
        color: p.color,
        x: Math.floor((COLS - p.shape[0].length) / 2),
        y: 0
      };
    }

    function resetGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 800;
      scoreEl.textContent = '0';
      linesEl.textContent = '0';
      levelEl.textContent = '1';
      nextPiece = randomPiece();
      spawnNext();
      overlay.style.display = 'none';
      isRunning = true;
      isPaused = false;
      pauseBtn.textContent = 'Pause';
    }

    function spawnNext() {
      currentPiece = nextPiece;
      nextPiece = randomPiece();
      drawNext();
      if (collide(currentPiece)) {
        gameOver();
      }
    }

    function drawNext() {
      nextCtx.fillStyle = '#1e293b';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      const s = 16;
      const ox = (nextCanvas.width - nextPiece.shape[0].length * s) / 2;
      const oy = (nextCanvas.height - nextPiece.shape.length * s) / 2;
      nextCtx.fillStyle = nextPiece.color;
      nextPiece.shape.forEach((row, r) => {
        row.forEach((v, c) => {
          if (v) nextCtx.fillRect(ox + c * s, oy + r * s, s - 1, s - 1);
        });
      });
    }

    function collide(p) {
      for (let r = 0; r < p.shape.length; r++) {
        for (let c = 0; c < p.shape[r].length; c++) {
          if (p.shape[r][c]) {
            const gx = p.x + c;
            const gy = p.y + r;
            if (gx < 0 || gx >= COLS || gy >= ROWS || (gy >= 0 && grid[gy][gx])) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function rotate(p) {
      const rotated = p.shape[0].map((_, index) => p.shape.map(row => row[index]).reverse());
      const prev = p.shape;
      p.shape = rotated;
      if (collide(p)) {
        p.shape = prev;
      }
    }

    function merge() {
      currentPiece.shape.forEach((row, r) => {
        row.forEach((v, c) => {
          if (v) {
            const gy = currentPiece.y + r;
            const gx = currentPiece.x + c;
            if (gy >= 0) grid[gy][gx] = currentPiece.color;
          }
        });
      });
      clearLines();
      spawnNext();
    }

    function clearLines() {
      let linesCleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(c => c !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          linesCleared++;
          r++;
        }
      }
      if (linesCleared > 0) {
        lines += linesCleared;
        const pts = [0, 100, 300, 500, 800];
        score += (pts[linesCleared] || 100) * level;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(120, 800 - (level - 1) * 70);
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;
      }
    }

    function drop() {
      currentPiece.y++;
      if (collide(currentPiece)) {
        currentPiece.y--;
        merge();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      while (!collide(currentPiece)) {
        currentPiece.y++;
      }
      currentPiece.y--;
      merge();
      dropCounter = 0;
    }

    function gameOver() {
      isRunning = false;
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#ef4444';
      startBtn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid blocks
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            ctx.fillStyle = grid[r][c];
            ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK - 1, BLOCK - 1);
          }
        }
      }

      // Current piece
      if (currentPiece) {
        ctx.fillStyle = currentPiece.color;
        currentPiece.shape.forEach((row, r) => {
          row.forEach((v, c) => {
            if (v && currentPiece.y + r >= 0) {
              ctx.fillRect((currentPiece.x + c) * BLOCK, (currentPiece.y + r) * BLOCK, BLOCK - 1, BLOCK - 1);
            }
          });
        });
      }
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (isRunning && !isPaused) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
          drop();
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', e => {
      if (!isRunning || isPaused) return;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) {
        currentPiece.x--;
        if (collide(currentPiece)) currentPiece.x++;
      } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
        currentPiece.x++;
        if (collide(currentPiece)) currentPiece.x--;
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        drop();
      } else if (['ArrowUp', 'KeyW'].includes(e.code)) {
        rotate(currentPiece);
      } else if (e.code === 'Space') {
        e.preventDefault();
        hardDrop();
      }
    });

    pauseBtn.addEventListener('click', () => {
      if (!isRunning) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
    });

    startBtn.addEventListener('click', resetGame);
    requestAnimationFrame(update);
  </script>
</body>
</html>
