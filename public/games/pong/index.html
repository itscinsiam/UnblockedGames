<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pong Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 540px;
      height: 380px;
      max-width: 95vw;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #060913;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 80px;
      font-size: 36px;
      font-weight: 800;
      color: #e2e8f0;
      pointer-events: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 19, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
    .diff-select {
      display: flex;
      gap: 8px;
    }
    .diff-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .diff-btn.active {
      background: #4f46e5;
      color: white;
      border-color: #6366f1;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="540" height="380"></canvas>
    <div class="hud">
      <div id="score-p1">0</div>
      <div id="score-p2">0</div>
    </div>
    <div class="overlay" id="overlay">
      <h1 id="overlay-title" style="font-size: 32px; color: #818cf8;">PONG CLASSIC</h1>
      <p style="color: #94a3b8; font-size: 14px;">First to 7 wins! [W/S] or Mouse to move</p>
      <div class="diff-select">
        <button class="diff-btn" data-diff="easy">Easy</button>
        <button class="diff-btn active" data-diff="normal">Normal</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
      </div>
      <button class="btn" id="start-btn">Serve Ball</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');
    const scoreP1El = document.getElementById('score-p1');
    const scoreP2El = document.getElementById('score-p2');

    let p1 = { x: 20, y: 150, w: 10, h: 70, score: 0, speed: 6 };
    let p2 = { x: 510, y: 150, w: 10, h: 70, score: 0, speed: 4.2 };
    let ball = { x: 270, y: 190, r: 6, vx: 5, vy: 3 };
    let isRunning = false;
    let keys = {};
    let difficulty = 'normal';

    const diffSpeeds = {
      easy: 3.2,
      normal: 4.5,
      hard: 6.2
    };

    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        difficulty = btn.dataset.diff;
        p2.speed = diffSpeeds[difficulty];
      });
    });

    function resetGame() {
      p1.score = 0;
      p2.score = 0;
      scoreP1El.textContent = '0';
      scoreP2El.textContent = '0';
      resetBall();
      overlay.style.display = 'none';
      isRunning = true;
    }

    function resetBall(serveTo = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * 0.8 - 0.4);
      const speed = 5.5;
      ball.vx = (serveTo === 1 ? -1 : 1) * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function update() {
      if (!isRunning) return;

      // Player 1 controls (W/S or Up/Down)
      if (keys['KeyW'] || keys['ArrowUp']) p1.y = Math.max(0, p1.y - p1.speed);
      if (keys['KeyS'] || keys['ArrowDown']) p1.y = Math.min(canvas.height - p1.h, p1.y + p1.speed);

      // AI controls
      const targetY = ball.y - p2.h / 2;
      if (ball.vx > 0) {
        if (p2.y < targetY - 4) p2.y += p2.speed;
        else if (p2.y > targetY + 4) p2.y -= p2.speed;
      }
      p2.y = Math.max(0, Math.min(canvas.height - p2.h, p2.y));

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / bottom bounce
      if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy *= -1; }
      if (ball.y + ball.r >= canvas.height) { ball.y = canvas.height - ball.r; ball.vy *= -1; }

      // P1 Paddle Collision
      if (ball.x - ball.r <= p1.x + p1.w && ball.x + ball.r >= p1.x &&
          ball.y >= p1.y && ball.y <= p1.y + p1.h) {
        ball.vx = Math.abs(ball.vx) * 1.05;
        const hitNorm = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
        ball.vy = hitNorm * 5.5;
      }

      // P2 Paddle Collision
      if (ball.x + ball.r >= p2.x && ball.x - ball.r <= p2.x + p2.w &&
          ball.y >= p2.y && ball.y <= p2.y + p2.h) {
        ball.vx = -Math.abs(ball.vx) * 1.05;
        const hitNorm = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
        ball.vy = hitNorm * 5.5;
      }

      // Scoring
      if (ball.x < 0) {
        p2.score++;
        scoreP2El.textContent = p2.score;
        checkWin(1);
      } else if (ball.x > canvas.width) {
        p1.score++;
        scoreP1El.textContent = p1.score;
        checkWin(2);
      }
    }

    function checkWin(nextServer) {
      if (p1.score >= 7) {
        endGame('Player 1 Wins!');
      } else if (p2.score >= 7) {
        endGame('Computer Wins!');
      } else {
        resetBall(nextServer);
      }
    }

    function endGame(msg) {
      isRunning = false;
      overlayTitle.textContent = msg;
      startBtn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
      ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      const mouseY = (e.clientY - rect.top) * scaleY;
      p1.y = Math.max(0, Math.min(canvas.height - p1.h, mouseY - p1.h / 2));
    });

    startBtn.addEventListener('click', resetGame);
    loop();
  </script>
</body>
</html>
