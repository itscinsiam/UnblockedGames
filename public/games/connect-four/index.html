<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Connect Four</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .wrapper {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 95vw;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .turn-disc {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #2563eb; }
    #board {
      background: #1e3a8a;
      padding: 12px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(7, 46px);
      grid-template-rows: repeat(6, 46px);
      gap: 8px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    }
    .slot {
      width: 46px;
      height: 46px;
      background: #0f172a;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
    }
    .slot:hover {
      transform: scale(0.97);
    }
    .slot.p1 {
      background: #ef4444;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 10px rgba(239, 68, 68, 0.5);
    }
    .slot.p2 {
      background: #eab308;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 10px rgba(234, 179, 8, 0.5);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="status" id="status">
        <span class="turn-disc" id="turn-disc" style="background: #ef4444;"></span>
        <span id="status-text">Your Turn (Red)</span>
      </div>
      <button class="btn" id="restart-btn">Restart</button>
    </div>

    <div id="board"></div>

    <div style="font-size: 13px; color: #94a3b8;">Click any column to drop your disc vs AI (Yellow)</div>
  </div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let currentPlayer = 1; // 1 = Human (Red), 2 = AI (Yellow)
    let gameOver = false;

    const boardEl = document.getElementById('board');
    const statusTextEl = document.getElementById('status-text');
    const turnDiscEl = document.getElementById('turn-disc');
    const restartBtn = document.getElementById('restart-btn');

    function init() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      currentPlayer = 1;
      gameOver = false;
      statusTextEl.textContent = 'Your Turn (Red)';
      turnDiscEl.style.background = '#ef4444';
      render();
    }

    function dropDisc(c, player) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c] === 0) {
          grid[r][c] = player;
          return r;
        }
      }
      return -1;
    }

    function checkWin(p) {
      // Horizontal
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === p && grid[r][c+1] === p && grid[r][c+2] === p && grid[r][c+3] === p) return true;
        }
      }
      // Vertical
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === p && grid[r+1][c] === p && grid[r+2][c] === p && grid[r+3][c] === p) return true;
        }
      }
      // Diagonal down-right
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === p && grid[r+1][c+1] === p && grid[r+2][c+2] === p && grid[r+3][c+3] === p) return true;
        }
      }
      // Diagonal up-right
      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === p && grid[r-1][c+1] === p && grid[r-2][c+2] === p && grid[r-3][c+3] === p) return true;
        }
      }
      return false;
    }

    function checkDraw() {
      return grid[0].every(val => val !== 0);
    }

    function handleColumnClick(c) {
      if (gameOver || currentPlayer !== 1) return;

      const r = dropDisc(c, 1);
      if (r === -1) return; // Column full

      render();

      if (checkWin(1)) {
        gameOver = true;
        statusTextEl.textContent = '🎉 You Won!';
        return;
      }
      if (checkDraw()) {
        gameOver = true;
        statusTextEl.textContent = 'Game Draw!';
        return;
      }

      currentPlayer = 2;
      statusTextEl.textContent = 'AI Thinking...';
      turnDiscEl.style.background = '#eab308';

      setTimeout(aiMove, 400);
    }

    function aiMove() {
      if (gameOver) return;

      // 1. Check if AI can win immediately
      for (let c = 0; c < COLS; c++) {
        if (grid[0][c] === 0) {
          const r = dropDisc(c, 2);
          if (checkWin(2)) {
            render();
            gameOver = true;
            statusTextEl.textContent = 'AI Wins!';
            return;
          }
          grid[r][c] = 0; // undo
        }
      }

      // 2. Block player if player is about to win
      for (let c = 0; c < COLS; c++) {
        if (grid[0][c] === 0) {
          const r = dropDisc(c, 1);
          if (checkWin(1)) {
            grid[r][c] = 0;
            dropDisc(c, 2);
            render();
            finishAiTurn();
            return;
          }
          grid[r][c] = 0;
        }
      }

      // 3. Center preference or random
      const validCols = [];
      const order = [3, 2, 4, 1, 5, 0, 6];
      for (let c of order) {
        if (grid[0][c] === 0) validCols.push(c);
      }
      const chosenCol = validCols[0] !== undefined ? validCols[0] : 0;
      dropDisc(chosenCol, 2);
      render();
      finishAiTurn();
    }

    function finishAiTurn() {
      if (checkWin(2)) {
        gameOver = true;
        statusTextEl.textContent = 'AI Wins!';
        return;
      }
      if (checkDraw()) {
        gameOver = true;
        statusTextEl.textContent = 'Game Draw!';
        return;
      }
      currentPlayer = 1;
      statusTextEl.textContent = 'Your Turn (Red)';
      turnDiscEl.style.background = '#ef4444';
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          if (grid[r][c] === 1) slot.classList.add('p1');
          if (grid[r][c] === 2) slot.classList.add('p2');
          slot.addEventListener('click', () => handleColumnClick(c));
          boardEl.appendChild(slot);
        }
      }
    }

    restartBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
