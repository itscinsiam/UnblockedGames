<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dino Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 580px;
      height: 240px;
      max-width: 95vw;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #0f172a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 14px;
      right: 20px;
      display: flex;
      gap: 16px;
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      pointer-events: none;
    }
    .hud span { color: #38bdf8; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="580" height="240"></canvas>
    <div class="hud">
      <div>HI <span id="hi-score">00000</span></div>
      <div><span id="score">00000</span></div>
    </div>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title" style="font-size: 26px; color: #38bdf8;">T-REX RUNNER</h2>
      <p style="color: #94a3b8; font-size: 13px;">Press [Space] or [Arrow Up] to jump, [Arrow Down] to duck</p>
      <button class="btn" id="start-btn">Start Run</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');
    const scoreEl = document.getElementById('score');
    const hiScoreEl = document.getElementById('hi-score');

    let hiScore = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    hiScoreEl.textContent = String(hiScore).padStart(5, '0');

    let dino = { x: 50, y: 160, w: 28, h: 42, vy: 0, gravity: 0.65, isGrounded: true, isDucking: false };
    let obstacles = [];
    let clouds = [];
    let speed = 5.2;
    let score = 0;
    let frame = 0;
    let isRunning = false;
    let groundY = 202;

    function resetGame() {
      dino.y = groundY - 42;
      dino.h = 42;
      dino.vy = 0;
      dino.isGrounded = true;
      dino.isDucking = false;
      obstacles = [];
      clouds = [{ x: 200, y: 40 }, { x: 450, y: 60 }];
      speed = 5.2;
      score = 0;
      frame = 0;
      overlay.style.display = 'none';
      isRunning = true;
    }

    function jump() {
      if (dino.isGrounded && isRunning) {
        dino.vy = -12;
        dino.isGrounded = false;
      } else if (!isRunning) {
        resetGame();
      }
    }

    function spawnObstacle() {
      const isBird = Math.random() < 0.3 && score > 200;
      if (isBird) {
        obstacles.push({
          x: canvas.width,
          y: groundY - 45 - Math.random() * 25,
          w: 26,
          h: 18,
          isBird: true
        });
      } else {
        const h = 26 + Math.floor(Math.random() * 18);
        obstacles.push({
          x: canvas.width,
          y: groundY - h,
          w: 16 + Math.floor(Math.random() * 12),
          h: h,
          isBird: false
        });
      }
    }

    function update() {
      if (!isRunning) return;

      frame++;
      score = Math.floor(frame / 4);
      scoreEl.textContent = String(score).padStart(5, '0');

      if (frame % 800 === 0) speed += 0.4;

      // Dino physics
      dino.vy += dino.gravity;
      dino.y += dino.vy;

      const currentH = dino.isDucking ? 26 : 42;
      if (dino.y + currentH >= groundY) {
        dino.y = groundY - currentH;
        dino.vy = 0;
        dino.isGrounded = true;
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= speed * 0.2;
        if (c.x < -60) {
          c.x = canvas.width + 30;
          c.y = 30 + Math.random() * 50;
        }
      });

      // Obstacles
      if (frame % Math.floor(80 + Math.random() * 40) === 0) {
        spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision check
        const dBox = {
          x: dino.x + 4,
          y: dino.y,
          w: dino.w - 8,
          h: currentH
        };

        if (dBox.x < obs.x + obs.w && dBox.x + dBox.w > obs.x &&
            dBox.y < obs.y + obs.h && dBox.y + dBox.h > obs.y) {
          gameOver();
          return;
        }

        if (obs.x + obs.w < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    function gameOver() {
      isRunning = false;
      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem('dino_hi', hiScore);
        hiScoreEl.textContent = String(hiScore).padStart(5, '0');
      }
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#ef4444';
      startBtn.textContent = 'Run Again';
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#1e293b';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, 22, 10, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x + 14, c.y - 4, 16, 12, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground line
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      // Ground speckles
      ctx.fillStyle = '#475569';
      for (let i = 0; i < 20; i++) {
        const gx = ((i * 35) - (frame * speed) % canvas.width + canvas.width) % canvas.width;
        ctx.fillRect(gx, groundY + 8 + (i % 3) * 6, (i % 2 === 0 ? 4 : 2), 2);
      }

      // Dino
      ctx.fillStyle = '#38bdf8';
      const curH = dino.isDucking ? 26 : 42;
      ctx.fillRect(dino.x, dino.y, dino.w, curH);
      // Eye
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(dino.x + 18, dino.y + 4, 4, 4);

      // Obstacles
      obstacles.forEach(obs => {
        if (obs.isBird) {
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 2, obs.h / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        }
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        jump();
      }
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        dino.isDucking = true;
      }
    });

    window.addEventListener('keyup', e => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        dino.isDucking = false;
      }
    });

    canvas.addEventListener('pointerdown', jump);
    startBtn.addEventListener('click', resetGame);
    loop();
  </script>
</body>
</html>
