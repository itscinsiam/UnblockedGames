<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title { font-size: 38px; font-weight: 800; color: #f1f5f9; letter-spacing: -1px; }
    .scores { display: flex; gap: 8px; }
    .score-box {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      text-align: center;
      min-width: 75px;
      border: 1px solid #334155;
    }
    .score-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 18px; font-weight: 700; color: #38bdf8; }
    .controls-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 13px;
      color: #94a3b8;
    }
    .btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
    #grid {
      width: 100%;
      max-width: 420px;
      height: 420px;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      position: relative;
      border: 1px solid #334155;
      touch-action: none;
    }
    .cell {
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      transition: transform 0.1s ease, background 0.1s;
    }
    .t-2 { background: #334155; color: #f8fafc; }
    .t-4 { background: #475569; color: #f8fafc; }
    .t-8 { background: #f97316; color: white; }
    .t-16 { background: #ea580c; color: white; }
    .t-32 { background: #ef4444; color: white; }
    .t-64 { background: #dc2626; color: white; }
    .t-128 { background: #eab308; color: white; font-size: 22px; box-shadow: 0 0 10px rgba(234,179,8,0.5); }
    .t-256 { background: #ca8a04; color: white; font-size: 22px; box-shadow: 0 0 12px rgba(202,138,4,0.6); }
    .t-512 { background: #10b981; color: white; font-size: 22px; box-shadow: 0 0 14px rgba(16,185,129,0.6); }
    .t-1024 { background: #059669; color: white; font-size: 18px; box-shadow: 0 0 16px rgba(5,150,105,0.7); }
    .t-2048 { background: #8b5cf6; color: white; font-size: 18px; box-shadow: 0 0 20px rgba(139,92,246,0.8); }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    .overlay h2 { font-size: 32px; color: #f8fafc; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="controls-bar">
    <span>Join tiles to reach <b>2048</b></span>
    <button class="btn" id="restart">New Game</button>
  </div>

  <div id="grid">
    <div class="overlay" id="game-over">
      <h2 id="over-title">Game Over!</h2>
      <button class="btn" id="try-again">Try Again</button>
    </div>
  </div>

  <script>
    let board = Array(16).fill(0);
    let score = 0;
    let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    document.getElementById('best').textContent = best;

    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('game-over');
    const overTitleEl = document.getElementById('over-title');

    function init() {
      board = Array(16).fill(0);
      score = 0;
      updateScore(0);
      gameOverEl.style.display = 'none';
      spawnTile();
      spawnTile();
      render();
    }

    function spawnTile() {
      const empties = [];
      board.forEach((v, i) => { if (v === 0) empties.push(i); });
      if (empties.length > 0) {
        const rand = empties[Math.floor(Math.random() * empties.length)];
        board[rand] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      // Remove old cells (except overlay)
      const cells = gridEl.querySelectorAll('.cell');
      cells.forEach(c => c.remove());

      for (let i = 0; i < 16; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const val = board[i];
        if (val > 0) {
          cell.textContent = val;
          cell.classList.add('t-' + (val <= 2048 ? val : 2048));
        }
        gridEl.appendChild(cell);
      }
    }

    function updateScore(delta) {
      score += delta;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        document.getElementById('best').textContent = best;
      }
    }

    function slide(row) {
      let arr = row.filter(x => x !== 0);
      let earned = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          earned += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(x => x !== 0);
      while (arr.length < 4) arr.push(0);
      return { row: arr, earned };
    }

    function move(dir) {
      let moved = false;
      let totalEarned = 0;

      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < 4; r++) {
          let row = [board[r * 4], board[r * 4 + 1], board[r * 4 + 2], board[r * 4 + 3]];
          if (dir === 'right') row.reverse();
          const res = slide(row);
          if (dir === 'right') res.row.reverse();
          for (let c = 0; c < 4; c++) {
            if (board[r * 4 + c] !== res.row[c]) moved = true;
            board[r * 4 + c] = res.row[c];
          }
          totalEarned += res.earned;
        }
      } else if (dir === 'up' || dir === 'down') {
        for (let c = 0; c < 4; c++) {
          let col = [board[c], board[c + 4], board[c + 8], board[c + 12]];
          if (dir === 'down') col.reverse();
          const res = slide(col);
          if (dir === 'down') res.row.reverse();
          for (let r = 0; r < 4; r++) {
            if (board[r * 4 + c] !== res.row[r]) moved = true;
            board[r * 4 + c] = res.row[r];
          }
          totalEarned += res.earned;
        }
      }

      if (moved) {
        updateScore(totalEarned);
        spawnTile();
        render();
        checkGameState();
      }
    }

    function checkGameState() {
      if (board.includes(2048) && !board.hasWon) {
        board.hasWon = true;
        overTitleEl.textContent = 'You reached 2048!';
        gameOverEl.style.display = 'flex';
        return;
      }
      if (board.includes(0)) return;

      // check if any move possible
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r * 4 + c];
          if (c < 3 && val === board[r * 4 + c + 1]) return;
          if (r < 3 && val === board[(r + 1) * 4 + c]) return;
        }
      }
      overTitleEl.textContent = 'Game Over!';
      gameOverEl.style.display = 'flex';
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
    });

    let touchStartX = 0, touchStartY = 0;
    gridEl.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    gridEl.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        move(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        move(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    document.getElementById('restart').addEventListener('click', init);
    document.getElementById('try-again').addEventListener('click', init);

    init();
  </script>
</body>
</html>
